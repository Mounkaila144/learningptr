<VirtualHost *:80>
    ServerAdmin webmaster@votredomaine.com
    ServerName votredomaine.com
    ServerAlias www.votredomaine.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/votredomaine.com-error.log
    CustomLog ${APACHE_LOG_DIR}/votredomaine.com-access.log combined

    ProxyPassMatch ^/(.*\.php)$ fcgi://app:9000/var/www/html/public/$1
</VirtualHost> 