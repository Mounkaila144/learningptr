<VirtualHost *:80>
    ServerAdmin webmaster@ptrniger.com
    ServerName ptrniger.com
    ServerAlias www.ptrniger.com
    DocumentRoot /var/www/ptr

    <Directory /var/www/ptr>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ptrniger.com-error.log
    CustomLog ${APACHE_LOG_DIR}/ptrniger.com-access.log combined

    # PHP via FPM
    ProxyPassMatch ^/(.*\.php)$ fcgi://smart_school_app_prod:9000/var/www/html/$1
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@ptrniger.com
    ServerName ptrniger.com
    ServerAlias www.ptrniger.com
    DocumentRoot /var/www/ptr

    <Directory /var/www/ptr>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ptrniger.com-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ptrniger.com-ssl-access.log combined

    # PHP via FPM
    ProxyPassMatch ^/(.*\.php)$ fcgi://smart_school_app_prod:9000/var/www/html/$1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ptrniger.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ptrniger.com/privkey.pem

    # Paramètres SSL recommandés par Certbot/Apache
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>